name: Auto Release (arm64-v8a)

on:
  push:
    branches: [ "master", "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "website/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      manual_tag:
        description: "自定义版本标签 (留空则自动按 pre1, pre2 递增)"
        required: false
        type: string
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  prepare-version:
    name: "00 · Prepare Version & Release Notes"
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_title: ${{ steps.version.outputs.release_title }}
      release_body: ${{ steps.version.outputs.release_body }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Compute version tag and release notes
        id: version
        shell: bash
        run: |
          set -eu
          base_version="$(grep '^project.version.name=' product.properties | cut -d= -f2- | tr -d ' \r\n')"
          echo "Base upstream version: ${base_version}"

          manual_tag="${{ inputs.manual_tag }}"
          if [ -n "${manual_tag}" ]; then
            release_tag="${manual_tag}"
            release_title="YumeBox ${manual_tag}"
          else
            git fetch --tags --force || true
            existing_nums=$(git tag -l "v${base_version}-pre*" "${base_version}-pre*" 2>/dev/null | sed -E "s/^v?${base_version}-pre//" | grep -E '^[0-9]+$' | sort -n || true)
            latest_num=$(printf '%s\n' "${existing_nums}" | grep -v '^$' | tail -n 1 || true)
            if [ -z "${latest_num}" ]; then
              next_num=1
            else
              next_num=$((latest_num + 1))
            fi
            release_tag="v${base_version}-pre${next_num}"
            release_title="YumeBox v${base_version}-pre${next_num}"
          fi

          echo "Target tag: ${release_tag}"
          echo "Target title: ${release_title}"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_title=${release_title}" >> "$GITHUB_OUTPUT"

          # Generate release notes
          cat << EOF > release_body.md
          ## 🚀 YumeBox ${release_tag}

          ### 📦 构建信息
          - **版本号**：\`${release_tag}\`（基于上游版本 \`${base_version}\`）
          - **目标架构**：\`arm64-v8a\`
          - **发布签名**：固化固定密钥签名（支持覆盖安装更新，无需卸载）
          - **构建分支**：\`${{ github.ref_name }}\`
          - **提交哈希**：\`${{ github.sha }}\`
          - **构建时间**：$(date -u "+%Y-%m-%d %H:%M:%S UTC")

          ### 📝 更新记录
          EOF

          prev_tag=""
          if [ -z "${manual_tag}" ]; then
            prev_tag=$(git tag -l "v${base_version}-pre*" "${base_version}-pre*" 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "${prev_tag}" ] || ! git rev-parse "${prev_tag}" >/dev/null 2>&1; then
            prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          fi

          if [ -n "${prev_tag}" ] && git rev-parse "${prev_tag}" >/dev/null 2>&1; then
            echo "对比上一版本 \`${prev_tag}\` 的提交变更：" >> release_body.md
            git log "${prev_tag}..HEAD" --pretty=format:"- %s (\`%h\`)" --no-merges >> release_body.md || true
          else
            echo "近期提交变更：" >> release_body.md
            git log -n 10 --pretty=format:"- %s (\`%h\`)" --no-merges >> release_body.md || true
          fi

          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "> 💡 **提示**：本安装包使用固化的 Android 发布签名密钥构建，后续下载新 Release 版本可直接覆盖升级，保留全部配置与数据。" >> release_body.md

          delimiter="EOF_$(date +%s)_$$"
          {
            echo "release_body<<${delimiter}"
            cat release_body.md
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

  prebuild-modules-stable:
    name: "01 · Prebuild Modules"
    needs: prepare-version
    uses: ./.github/workflows/reusable-prebuild-modules.yml
    with:
      channel: stable
      build_type: release
    secrets: inherit

  build-geo-stable:
    name: "01 · Geo (Stable)"
    needs: prepare-version
    uses: ./.github/workflows/reusable-build-geo.yml
    with:
      channel: stable
    secrets: inherit

  build-native-abi-stable-arm64-v8a:
    name: "02 · Native (arm64-v8a)"
    needs: prepare-version
    uses: ./.github/workflows/reusable-build-native-abi.yml
    with:
      channel: stable
      kernel_channel: alpha
      abi: arm64-v8a
    secrets: inherit

  bundle-native-stable:
    name: "03 · Bundle (Stable)"
    needs:
      - build-geo-stable
      - build-native-abi-stable-arm64-v8a
    uses: ./.github/workflows/reusable-bundle-native.yml
    with:
      channel: stable
    secrets: inherit

  build-apk-stable-app:
    name: "04 · Build APK (arm64-v8a)"
    needs:
      - prepare-version
      - bundle-native-stable
      - prebuild-modules-stable
    uses: ./.github/workflows/reusable-build-apk-only.yml
    with:
      channel: stable
      module: app
      release_tag: ${{ needs.prepare-version.outputs.release_tag }}
      meta_asset_name: YumeBox-stable-meta.json
      raw_apk_artifact_name: apk-raw-stable-app
      build_type: release
    secrets: inherit

  prepare-publish-stable-app:
    name: "05 · Prepare Publish"
    needs:
      - prepare-version
      - build-apk-stable-app
    uses: ./.github/workflows/reusable-prepare-publish.yml
    with:
      channel: stable
      module: app
      artifact_prefix: YumeBox
      release_tag: ${{ needs.prepare-version.outputs.release_tag }}
      meta_asset_name: YumeBox-stable-meta.json
      raw_apk_artifact_name: apk-raw-stable-app
      publish_artifact_name: publish-stable-app
      apk_name_tail: ${{ needs.build-apk-stable-app.outputs.apk_name_tail }}
    secrets: inherit

  publish-release-stable:
    name: "06 · Publish to Release"
    needs:
      - prepare-version
      - prepare-publish-stable-app
    uses: ./.github/workflows/reusable-publish-release.yml
    with:
      channel: stable
      release_tag: ${{ needs.prepare-version.outputs.release_tag }}
      release_name: ${{ needs.prepare-version.outputs.release_title }}
      prerelease: false
      publish_artifacts: publish-stable-app
      recreate_release: false
      body: ${{ needs.prepare-version.outputs.release_body }}
    secrets: inherit

  cleanup-artifacts:
    name: "07 · Cleanup Artifacts"
    needs: publish-release-stable
    if: always()
    permissions:
      actions: write
    uses: ./.github/workflows/reusable-cleanup-artifacts.yml
